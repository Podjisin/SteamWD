[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "steamwd"
version = "0.1.0"
description = "Steam Workshop downloader with a Tkinter GUI, powered by steamcmd."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "keyring>=25",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pyinstaller>=6",
    "types-requests",
]

[project.gui-scripts]
steamwd = "steamwd.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
steamwd = ["resources/*"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "N", "PTH"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
